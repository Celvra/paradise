org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Load bearing on this machine, not a preference. The pub cache lives on C: and
# the project on D:, and Kotlin's incremental caches store each source file as a
# path relative to the module directory. Relative paths cannot span volumes, so
# RelocatableFileToPathConverter throws "this and base files have different
# roots" and the Kotlin daemon dies closing its caches -- which surfaces as a
# bogus failure in whichever plugin module compiles first (android_file_picker
# here). Turning incremental compilation off skips that bookkeeping entirely.
kotlin.incremental=false
