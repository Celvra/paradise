name: paradise
description: Telegram styled AI chat client
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  characters: ^1.3.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  file_picker: ^13.1.0
  photo_manager: ^3.5.1
  geolocator: ^13.0.1
  flutter_contacts: ^2.5.0
  flutter_svg: ^2.3.0
  # 以下来自 anthropomorphic-ai-behavior-implementation.zip 的 lib/ 依赖
  path_provider: ^2.1.4
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  # 0.5.2 pinned by the zip cannot compile on Flutter 3.47: it uses the removed
  # io.flutter.plugin.common.ShimPluginRegistry / PluginRegistrantCallback embedding API.
  workmanager: ^0.10.10
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    # provider logos, see core/provider_icons.dart
    - assets/providers/
