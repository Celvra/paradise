name: paradise
description: Telegram styled AI chat client
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  characters: ^1.3.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  # message history, which outgrew SharedPreferences: it rewrote the whole
  # json blob on every message and lost everything if one record failed to parse
  sqflite: ^2.4.1
  image_picker: ^1.1.2
  file_picker: ^13.1.0
  photo_manager: ^3.5.1
  geolocator: ^13.0.1
  flutter_contacts: ^2.5.0
  flutter_svg: ^2.3.0
  # 以下来自 anthropomorphic-ai-behavior-implementation.zip 的 lib/ 依赖
  path_provider: ^2.1.4
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  # 0.5.2 pinned by the zip cannot compile on Flutter 3.47: it uses the removed
  # io.flutter.plugin.common.ShimPluginRegistry / PluginRegistrantCallback embedding API.
  workmanager: ^0.10.10
  url_launcher: ^6.3.2
  # workspace file tools and browser
  path: ^1.9.0
  glob: ^2.1.3
  crypto: ^3.0.5
  archive: ^3.6.1
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  webview_flutter: ^4.10.0

  # vendored fork of Termphin/terminal_view 0.2.1, MIT. A VT100 parser and a
  # RenderBox based renderer; the pub version pulls in a benchmark suite and an
  # example app this project has no use for.
  # see third_party/terminal_view/NOTICE for the xterm.dart lineage
  terminal_view:
    path: ./third_party/terminal_view

dev_dependencies:
  file_picker_platform_interface: ^4.0.0
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.3
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    # provider logos, see core/provider_icons.dart
    - assets/providers/

# The sqlite3 build hook downloads a prebuilt library, which this machine cannot
# reach. System SQLite is only used by the ffi path that flutter test runs on;
# on Android the plugin uses the platform library and this hook does nothing.
hooks:
  user_defines:
    sqlite3:
      source: system
