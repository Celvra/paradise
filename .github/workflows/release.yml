name: Release

on:
  push:
    tags: ['v*']
  # Rebuilding a release means re-running this, not deleting the tag: deleting a
  # tag that already has a draft leaves the draft pointing at a ref that is gone.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and cut the draft release from
        required: true

# Creating the draft is the only step that needs write access, and only for this
# run's own token.
permissions:
  contents: write

# Two runs of the same tag would race each other into creating two drafts.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  KEYSTORE_PATH: android/app/paradise-release.jks
  KEY_PROPERTIES: android/key.properties

jobs:
  build:
    name: Build release APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # a manual run starts on the branch it was launched from, so it has to
          # be pointed at the tag explicitly
          ref: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # pinned to the version CONTRIBUTING.md tells contributors to use, so
          # CI, the release and the local instructions cannot drift apart
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Accept Android licences
        run: yes | flutter doctor --android-licenses > /dev/null 2>&1 || true

      - run: flutter pub get

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # The keystore never enters the repository. It lives as a base64 Actions
      # secret and is rebuilt into the workspace here, which is why .gitignore
      # covers *.jks and key.properties as well: the point is that even a
      # mistake on this step cannot commit one.
      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set on this repository"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set on this repository"
              exit 1
            fi
          done
          # storeFile is resolved by the app module, so this is relative to
          # android/app and has to match KEYSTORE_PATH's directory
          cat > "$KEY_PROPERTIES" <<EOF
          storeFile=paradise-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # A tag that disagrees with pubspec.yaml ships the wrong versionName and,
      # worse, a versionCode the store has already seen. Fail before spending
      # twenty minutes on a build that cannot be published.
      - name: The tag has to match the version in pubspec
        run: |
          TAG="${GITHUB_REF_NAME}"
          DECLARED=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          if [ "$TAG" != "v$DECLARED" ]; then
            echo "::error::tag $TAG does not match pubspec version $DECLARED. Bump pubspec.yaml or retag."
            exit 1
          fi
          echo "version $DECLARED"

      # --split-per-abi produces one APK per ABI and no universal one, so the
      # universal build is a second invocation. Flutter only offers three ABIs:
      # there is no 32-bit x86 engine, so "x86" here is x86_64.
      - name: Build the per-ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Build the universal APK
        run: flutter build apk --release

      # Proves the signing config took effect, which a successful build alone
      # does not: an APK signed with the debug key also builds fine, and that is
      # the failure mode this repository used to have.
      - name: Verify the signature on every APK
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          for apk in build/app/outputs/flutter-apk/*.apk; do
            case "$apk" in *debug*) continue;; esac
            echo "=== $(basename "$apk")"
            "$APKSIGNER" verify --verbose "$apk" | grep -Ei "Verified using|scheme" || true
            "$APKSIGNER" verify --print-certs "$apk" | grep -i "DN:" || true
          done

      # Names the ABIs so a user does not have to guess which file is theirs,
      # which is the single most common question about a multi-APK release.
      - name: Rename with the version
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          mkdir -p dist
          for abi in armeabi-v7a arm64-v8a x86_64; do
            src="build/app/outputs/flutter-apk/app-$abi-release.apk"
            [ -f "$src" ] || { echo "::error::missing $src"; exit 1; }
            mv "$src" "dist/paradise-$VERSION-$abi.apk"
          done
          mv build/app/outputs/flutter-apk/app-release.apk "dist/paradise-$VERSION-universal.apk"
          ls -la dist

      # Draft, not published: the APKs are unsigned by anything but this key and
      # nobody has looked at the notes yet.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          cat > notes.md <<EOF
          Draft, cut by CI on \`$TAG\`.

          | File | ABI |
          | --- | --- |
          | \`paradise-$VERSION-arm64-v8a.apk\` | 64-bit ARM, almost every current phone |
          | \`paradise-$VERSION-armeabi-v7a.apk\` | 32-bit ARM, older and cheaper devices |
          | \`paradise-$VERSION-x86_64.apk\` | Intel and AMD, emulators |
          | \`paradise-$VERSION-universal.apk\` | all of the above in one file, the largest |

          Install the one matching your device; \`uname -m\` tells you if you are
          not sure. Android will refuse an APK built for a different ABI.

          Signed with the v1, v2 and v3 APK signature schemes.
          EOF
          gh release create "$TAG" \
            --draft \
            --title "$TAG" \
            --notes-file notes.md \
            dist/*.apk